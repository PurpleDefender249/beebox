# BeeBox recorder settings. Every line is optional; delete one to use its default.
# After editing, apply with:  sudo systemctl restart beebox

# Time between samples (250ms to 10s).
#interval = 1s

# How much history to keep in the rolling recording (1m to 2h).
# The recording uses about 2 KB per sample: 15 minutes at 1s is under 2 MB.
#window = 15m

# How often samples are forced to disk (between interval and 1m).
# Lower values lose less data in a sudden power cut but write more often.
#flush = 5s

# Apps listed per sample for memory and processor use (1 to 10).
#top_processes = 5

# Crash reports and raw recordings of earlier boots to keep.
#keep_reports = 50
#keep_rings = 10
