<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>BeeBox</title>
  <desc>A bee whose body is a striped flight-recorder box, flying inside a honeycomb cell and leaving a heartbeat line behind it.</desc>
  <defs>
    <clipPath id="beebox-cell">
      <polygon points="64,8 112.5,36 112.5,92 64,120 15.5,92 15.5,36"/>
    </clipPath>
    <clipPath id="beebox-body">
      <rect x="-24" y="-15" width="46" height="31" rx="7"/>
    </clipPath>
  </defs>

  <!-- Honeycomb cell -->
  <polygon points="64,8 112.5,36 112.5,92 64,120 15.5,92 15.5,36" fill="#1d2125" stroke="#1d2125" stroke-width="10" stroke-linejoin="round"/>

  <g clip-path="url(#beebox-cell)">
    <!-- The hive in the background -->
    <g fill="none" stroke="#f5b301" stroke-opacity="0.13" stroke-width="2">
      <polygon points="84.0,89.7 91.2,93.8 91.2,102.2 84.0,106.3 76.8,102.2 76.8,93.8"/>
      <polygon points="100.5,89.7 107.6,93.8 107.6,102.2 100.5,106.3 93.3,102.2 93.3,93.8"/>
      <polygon points="92.2,75.5 99.4,79.6 99.4,87.9 92.2,92.0 85.0,87.9 85.0,79.6"/>
      <polygon points="75.8,104.0 83.0,108.1 83.0,116.4 75.8,120.5 68.6,116.4 68.6,108.1"/>
      <polygon points="92.2,104.0 99.4,108.1 99.4,116.4 92.2,120.5 85.0,116.4 85.0,108.1"/>
      <polygon points="108.7,75.5 115.9,79.6 115.9,87.9 108.7,92.0 101.5,87.9 101.5,79.6"/>
    </g>

    <g transform="translate(70 70) rotate(-14) scale(0.8)">
      <!-- Flight path: the recording, drawn as a heartbeat -->
      <path d="M-80 3 H-64 L-61 -1.5 L-58 3 H-55 L-51 -15 L-46 18 L-42 3 H-37.5" fill="none" stroke="#f5b301" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Wings -->
      <ellipse cx="-7" cy="-22" rx="11" ry="17" transform="rotate(-28 -7 -22)" fill="#e6f0fb"/>
      <path d="M-6 -10 Q-10 -22 -14 -33" fill="none" stroke="#a9c2dd" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="9" cy="-21" rx="8.5" ry="13.5" transform="rotate(14 9 -21)" fill="#c9dbef"/>

      <!-- Body: a striped recorder box -->
      <path d="M-24 -4.5 L-32 1 L-24 6.5 Z" fill="#f5b301"/>
      <rect x="-24" y="-15" width="46" height="31" rx="7" fill="#f5b301"/>
      <g clip-path="url(#beebox-body)">
        <rect x="-25" y="-16" width="48" height="6" fill="#ffd34d"/>
        <g fill="#1d2125">
          <rect x="-11" y="-16" width="7" height="33"/>
          <rect x="4" y="-16" width="7" height="33"/>
        </g>
      </g>

      <!-- Head -->
      <circle cx="31" cy="1" r="10.5" fill="#1d2125" stroke="#f5b301" stroke-width="3.5"/>
      <circle cx="34.5" cy="-2" r="2.8" fill="#ffffff"/>
      <!-- Antennae -->
      <path d="M33 -9 Q36 -19 44 -21" fill="none" stroke="#f5b301" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M27 -10 Q26 -20 31 -25" fill="none" stroke="#f5b301" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="44.5" cy="-21" r="2.6" fill="#f5b301"/>
      <circle cx="31.5" cy="-25.5" r="2.6" fill="#f5b301"/>
    </g>
  </g>

  <!-- Rim -->
  <polygon points="64,8 112.5,36 112.5,92 64,120 15.5,92 15.5,36" fill="none" stroke="#f5b301" stroke-width="4" stroke-linejoin="round"/>
</svg>
