name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Formatting and vet
        run: make fmt-check vet

      - name: Tests (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Fuzz the ring reader (30 s)
        run: go test -run='^$' -fuzz=FuzzRead -fuzztime=30s ./internal/ring

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gosec
        # G104 (unchecked errors) is excluded: the only unchecked errors are
        # Close/Remove calls on cleanup paths after the real error is handled.
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude=G104 ./...

      - name: shellcheck
        run: shellcheck packaging/scripts/*.sh scripts/*.sh

      - name: Man page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq groff-base
          groff -man -ww -z packaging/man/beebox.1

  test-arm64:
    name: Tests on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  package:
    name: Build packages, run the service
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install nfpm and lintian
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          sudo apt-get update -qq && sudo apt-get install -y -qq lintian

      - name: Build packages
        run: make dist VERSION=0.0.0-ci

      - name: lintian
        run: lintian --fail-on error,warning build/dist/*.deb

      - name: Verify the systemd unit
        # --recursive-errors=no: judge only BeeBox's unit. By default verify
        # also fails on problems in any unit it pulls in (multi-user.target and
        # everything below it), and the runner image has some of its own.
        run: |
          sudo install -m755 build/linux-amd64/beebox /usr/bin/beebox
          systemd-analyze --version | head -n 1
          systemd-analyze verify --man=no --recursive-errors=no packaging/systemd/beebox.service
          # --threshold is on a 0-100 scale: 20 means "exposure 2.0 or lower"
          # (BeeBox scores 1.4).
          systemd-analyze security --offline=true --threshold=20 packaging/systemd/beebox.service

      # GitHub's runners boot with systemd, so the steps below exercise the
      # real, sandboxed service end to end.
      - name: Install the .deb; the service starts and records
        run: |
          sudo apt-get install -y ./build/dist/beebox_0.0.0~ci_amd64.deb
          sleep 5
          systemctl is-enabled beebox
          systemctl is-active beebox
          systemctl show beebox -p OOMPolicy -p ManagedOOMPreference -p NRestarts
          beebox status
          beebox now
          beebox doctor || true
          beebox view --sample --print-path

      - name: Restart resumes the same recording
        run: |
          sudo systemctl restart beebox
          sleep 3
          beebox status
          journalctl -u beebox -b --no-pager | grep -q "resumed recording for this boot"

      - name: The watchdog restarts a stuck recorder
        run: |
          pid=$(systemctl show -p MainPID --value beebox)
          sudo kill -STOP "$pid"
          sleep 40
          test "$(systemctl show -p NRestarts --value beebox)" -ge 1
          systemctl is-active beebox
          sudo journalctl -u beebox -b --no-pager | tail -n 20

      - name: Remove keeps history, purge deletes it
        run: |
          sudo apt-get remove -y beebox
          if systemctl is-active --quiet beebox; then echo "beebox is still running"; exit 1; fi
          test -d /var/lib/beebox/reports
          sudo apt-get purge -y beebox
          test ! -e /var/lib/beebox
          if ls /etc/systemd/system/*.wants/beebox.service 2>/dev/null; then echo "enable links left behind"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: build/dist/
          retention-days: 7

  distros:
    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - kalilinux/kali-rolling
          - fedora:42
          - fedora:latest
          - archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: build/dist
      - name: Install, check, reinstall, remove
        run: docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" scripts/test-packages.sh

  installer:
    name: Repository and one-line installer
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c
      - name: Build a signed repository and install from it on four distributions
        run: scripts/test-repo.sh
